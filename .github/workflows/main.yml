name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: weldias/ollama-remote-client
  DEFAULT_OLLAMA_HOST: http://example.invalid:11434

jobs:
  build-and-push:
    name: Build and publish Ollama client
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ollama-client:detected
          build-args: |
            DEFAULT_OLLAMA_HOST=${{ env.DEFAULT_OLLAMA_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Detect installed Ollama version
        id: ollama
        shell: bash
        run: |
          set -euo pipefail

          RAW_VERSION="$(
            docker run --rm \
              -e OLLAMA_HOST="${DEFAULT_OLLAMA_HOST}" \
              ollama-client:detected \
              ollama --version 2>&1
          )"

          echo "Ollama reports:"
          printf '%s\n' "${RAW_VERSION}"

          VERSION="$(
            printf '%s\n' "${RAW_VERSION}" |
              sed -nE 's/.*client version is[[:space:]]+v?([^[:space:]]+).*/\1/p' |
              head -n 1
          )"

          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not extract Ollama version"
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Ollama version: ${VERSION}"
            exit 1
          fi

          echo "Detected Ollama version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=ollama-${{ steps.ollama.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Ollama Remote Client
            org.opencontainers.image.description=Debian-based CLI client for a remote Ollama server
            org.opencontainers.image.vendor=weldias
            org.opencontainers.image.version=${{ steps.ollama.outputs.version }}

      - name: Tag the already-built image
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Creating local tag: ${tag}"
            docker tag ollama-client:detected "${tag}"
          done <<< "${GENERATED_TAGS}"

      - name: Push all tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Pushing image: ${tag}"
            docker push "${tag}"
          done <<< "${GENERATED_TAGS}"
